<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catalogue Search - ICSF</title>
    <link rel="stylesheet" href="/styles/styles.css" />
    <script type="module" src="/components/site-header.ts"></script>
    <script type="module" src="/components/site-nav.ts"></script>
    <script type="module" src="/components/site-footer.ts"></script>
    <script type="module" src="catalogue-search.ts"></script>
</head>
<body>
    <site-header subtitle="Catalogue Search"></site-header>
	<site-nav 
		submenu-parent="library/"
		extra-links='[
        {"href": "library/getting-to.html", "label": "Finding Us"},
		{"href": "library/bookshops.html", "label": "Bookshops"},
        {"href": "library/search.html", "label": "Catalogue Search"}
    	]'>
	</site-nav>

    <main class="main-content">
      <p class="help">Browse everything in the ICSF library. Start typing to filter by title, author, or series.</p>
      <br>

      <div class="catalogue-search-panel">
    <div class="search-header">
      <div class="search-input-wrapper">
        <label for="catalogue-search-input" class="sr-only">Search</label>
        <input
          id="catalogue-search-input"
          type="search"
          placeholder="Search by title, author, or series..."
          autocomplete="off"
        />
      </div>
      <p id="catalogue-status" aria-live="polite" class="catalogue-status">Loading catalogue&hellip;</p>
    </div>

    <!-- Results render in CSS Grid -->
    <ul id="catalogue-results" class="catalogue-results-grid"></ul>

    <div id="catalogue-pagination" class="catalogue-pagination" aria-live="polite">
      <button id="catalogue-prev-page" type="button">&larr; Previous</button>
      <span id="catalogue-page-indicator">Page 1</span>
      <button id="catalogue-next-page" type="button">Next &rarr;</button>
    </div>
      </div>
    </main>

    <site-footer></site-footer>
</body>
</html>
